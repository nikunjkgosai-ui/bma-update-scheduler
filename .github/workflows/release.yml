name: Publish BMA Update Scheduler release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        type: string
  push:
    paths:
      - .github/workflows/release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version || '1.0.14' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate requested version
        shell: bash
        run: |
          set -euo pipefail
          header_version="$(sed -n 's/^ \\* Version: //p' bma-update-scheduler.php | head -n 1 | tr -d '\\r')"
          stable_tag="$(sed -n 's/^Stable tag: //p' readme.txt | head -n 1 | tr -d '\\r')"
          test "$VERSION" = "$header_version"
          test "$VERSION" = "$stable_tag"
          test ! -e "bma-update-scheduler-$VERSION.zip"

      - name: Lint PHP
        shell: bash
        run: find . -type f -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Run schedule regression tests
        shell: bash
        run: php tests/test-reschedule-event.php

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/bma-update-scheduler
          rsync -a ./ build/bma-update-scheduler/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'build/'
          (
            cd build
            zip -q -r "bma-update-scheduler-$VERSION.zip" bma-update-scheduler
          )
          unzip -Z1 "build/bma-update-scheduler-$VERSION.zip" | grep -q '^bma-update-scheduler/bma-update-scheduler.php$'
          if unzip -Z1 "build/bma-update-scheduler-$VERSION.zip" | grep -q '\\\\'; then
            echo 'ZIP contains invalid backslash paths.' >&2
            exit 1
          fi
          sha256sum "build/bma-update-scheduler-$VERSION.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "v$VERSION" "build/bma-update-scheduler-$VERSION.zip" \
            --target "$GITHUB_SHA" \
            --title "BMA Update Scheduler $VERSION" \
            --notes-file - <<'NOTES'
          Fixes cron schedule replacement for small and large time adjustments.

          ### Changes

          - Removes existing matching cron events before creating a replacement, avoiding WordPress's ten-minute duplicate-event rejection.
          - Leaves unchanged schedules untouched.
          - Restores the previous event if WordPress rejects the replacement.
          - Preserves saved scheduling settings when cron replacement fails.
          - Clears matching stale events during successful replacement.
          - Adds focused regression coverage for unchanged schedules, five-minute adjustments, larger changes, disabling schedules, and scheduling failures.
          - Leaves backup protection, update locking, update execution, health checks, and reporting unchanged.
          NOTES
